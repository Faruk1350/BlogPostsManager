name: blog

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ------------------------------------------------------------------ app
  app:
    image: blog-app:latest
    build:
      context: .
      target: runtime
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: blog-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:5055:5000"
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env}
      SUPABASE_KEY: ${SUPABASE_KEY:?set SUPABASE_KEY in .env}
      APP_VERSION: ${APP_VERSION:-dev}
    volumes:
      - logs:/var/log/blog
      - uploads:/app/backend/uploads
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging

  # ----------------------------------------------------------- monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: blog-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 1G
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:latest
    container_name: blog-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=https://alerts.tavesglobal.com
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *default-logging

  # Basic-auth proxy in front of Alertmanager (it has no auth of its own).
  alertauth:
    image: caddy:2.8-alpine
    container_name: blog-alertauth
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:9094:9094"
    volumes:
      - ./observability/alertmanager/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - alertmanager
    logging: *default-logging

  # Local webhook receiver — alerts land here and are shipped to Loki.
  alert-webhook:
    image: python:3.12-alpine
    container_name: blog-alert-webhook
    restart: unless-stopped
    command: ["python", "/app/server.py"]
    environment:
      ALERT_LOG: /var/log/blog/alerts.log
      PORT: "9099"
    ports:
      - "127.0.0.1:9099:9099"
    volumes:
      - ./observability/webhook/server.py:/app/server.py:ro
      - logs:/var/log/blog
    depends_on:
      - app
    logging: *default-logging

  # Container metrics run as a host-side agent (scripts/host-metrics.sh) because
  # Colima/OrbStack cannot share a Unix Docker socket into containers on macOS.
  # Prometheus scrapes it via host.docker.internal:9417.

  grafana:
    image: grafana/grafana:latest
    container_name: blog-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_SERVER_ROOT_URL: https://grafana.tavesglobal.com
      GF_SERVER_DOMAIN: grafana.tavesglobal.com
      GF_SERVER_ENABLE_GZIP: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_LOG_MODE: console
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging

  loki:
    image: grafana/loki:latest
    container_name: blog-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging

  promtail:
    image: grafana/promtail:latest
    container_name: blog-promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - logs:/var/log/blog:ro
      - promtail-positions:/positions
    depends_on:
      - app
      - loki
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:latest
    container_name: blog-node-exporter
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /:/host:ro,rslave
    logging: *default-logging

  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: blog-blackbox
    restart: unless-stopped
    ports:
      - "127.0.0.1:9115:9115"
    volumes:
      - ./observability/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    logging: *default-logging

volumes:
  logs:
  uploads:
  prometheus-data:
  grafana-data:
  loki-data:
  alertmanager-data:
  promtail-positions:
