server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Application log (Python logging) — multiline joins tracebacks.
  - job_name: blog-app
    static_configs:
      - targets: [localhost]
        labels:
          job: blog-app
          log_type: app
          __path__: /var/log/blog/app.log
    pipeline_stages:
      - multiline:
          firstline: '^\d{4}-\d{2}-\d{2}'
          max_wait_time: 3s
      - regex:
          expression: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3} (?P<level>[A-Z]+) '
      - labels:
          level:

  # Gunicorn access log.
  - job_name: blog-access
    static_configs:
      - targets: [localhost]
        labels:
          job: blog-app
          log_type: access
          __path__: /var/log/blog/access.log

  # Alertmanager webhook receiver log (JSON lines).
  - job_name: alert-webhook
    static_configs:
      - targets: [localhost]
        labels:
          job: alert-webhook
          log_type: alerts
          __path__: /var/log/blog/alerts.log
    pipeline_stages:
      - json:
          expressions:
            status: status
            severity: severity
      - labels:
          status:
          severity:
