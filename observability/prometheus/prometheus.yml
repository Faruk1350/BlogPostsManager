global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: blog-local

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: blog-app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:5000"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: docker-metrics
    scrape_interval: 30s
    scrape_timeout: 25s
    static_configs:
      - targets: ["host.docker.internal:9417"]

  - job_name: cloudflared
    static_configs:
      - targets: ["host.docker.internal:60123"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://blog.tavesglobal.com/health
          - https://grafana.tavesglobal.com/api/health
          - https://alerts.tavesglobal.com/-/healthy
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
