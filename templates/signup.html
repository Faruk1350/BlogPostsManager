<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Blog Posts Manager</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(99,102,241,.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(124,58,237,.16),
                    transparent 35%
                ),
                #f5f7fb;

            padding: 20px;
        }

        .signup-wrapper {
            width: 100%;
            max-width: 450px;
        }

        /* BRAND */

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-icon {
            width: 62px;
            height: 62px;

            margin: 0 auto 14px;

            border-radius: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;
            color: white;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #7c3aed
                );

            box-shadow:
                0 12px 28px
                rgba(99,102,241,.3);
        }

        .brand h1 {
            color: #111827;
            font-size: 26px;
            margin-bottom: 6px;
        }

        .brand p {
            color: #64748b;
            font-size: 14px;
        }

        /* CARD */

        .card {
            background: rgba(255,255,255,.96);

            border: 1px solid #e5e7eb;

            border-radius: 20px;

            padding: 32px;

            box-shadow:
                0 20px 45px
                rgba(15,23,42,.10);
        }

        .card h2 {
            color: #111827;
            font-size: 22px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* FORM */

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            color: #334155;

            font-size: 14px;

            font-weight: 650;

            margin-bottom: 8px;
        }

        input {
            width: 100%;

            height: 48px;

            padding: 0 14px;

            border:
                1px solid #dbe1ea;

            border-radius: 11px;

            background: #f8fafc;

            color: #172033;

            font-size: 15px;

            outline: none;

            transition: .2s;
        }

        input:focus {
            background: white;

            border-color: #6366f1;

            box-shadow:
                0 0 0 4px
                rgba(99,102,241,.10);
        }

        input::placeholder {
            color: #94a3b8;
        }

        /* SIGNUP BUTTON */

        .signup-btn {
            width: 100%;

            height: 48px;

            border: none;

            border-radius: 11px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #7c3aed
                );

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 5px;

            box-shadow:
                0 8px 20px
                rgba(99,102,241,.25);

            transition: .2s;
        }

        .signup-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 25px
                rgba(99,102,241,.32);
        }

        .signup-btn:active {
            transform: translateY(0);
        }

        /* DIVIDER */

        .divider {
            display: flex;

            align-items: center;

            gap: 12px;

            margin: 24px 0;

            color: #94a3b8;

            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";

            height: 1px;

            flex: 1;

            background: #e5e7eb;
        }

        /* LOGIN LINK */

        .login-link {
            display: block;

            text-align: center;

            color: #4f46e5;

            text-decoration: none;

            font-size: 14px;

            font-weight: 650;
        }

        .login-link:hover {
            text-decoration: underline;
        }

        /* FOOTER */

        .footer {
            text-align: center;

            color: #94a3b8;

            font-size: 12px;

            margin-top: 20px;
        }

        /* MOBILE */

        @media (max-width: 500px) {

            .card {
                padding: 25px 20px;
            }

            .brand h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="signup-wrapper">

    <!-- BRAND -->

    <div class="brand">

        <div class="brand-icon">
            📝
        </div>

        <h1>
            Blog Posts Manager
        </h1>

        <p>
            Create, manage and share your blog posts
        </p>

    </div>


    <!-- SIGNUP CARD -->

    <div class="card">

        <h2>
            Create Your Account 🚀
        </h2>

        <p class="subtitle">
            Sign up to start managing your blog posts
        </p>


        <form method="POST" action="/signup">

            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

            </div>


            <!-- BUTTON -->

            <button
                type="submit"
                class="signup-btn"
            >
                Create Account
            </button>

        </form>


        <!-- DIVIDER -->

        <div class="divider">
            OR
        </div>


        <!-- LOGIN -->

        <a
            href="/login"
            class="login-link"
        >
            Already have an account? Login
        </a>

    </div>


    <div class="footer">
        Blog Posts Manager • Create your account securely
    </div>

</div>

</body>
</html>
